name: Test Semantic Version

on:
  push:
    branches:
      - '*'

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Check for config file
        run: |
          if [ -f ".releaserc" ]; then
            echo "Found .releaserc"
            cat .releaserc
          else
            echo "No config file found"
          fi

      - name: Check for deployment directories
        run: |
          echo "Checking deployment directories:"
          ls -la | grep deployment
