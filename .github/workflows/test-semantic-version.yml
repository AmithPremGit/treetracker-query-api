name: Verify Alpha Deployment Configuration

on:
  workflow_dispatch:
  push:
    branches:
      - denormalized-test

jobs:
  verify-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          chmod +x ./kustomize

      - name: List directory structure
        run: |
          echo "Checking directory structure:"
          find deployment* -type f | sort

      - name: Check for kustomization files
        run: |
          echo "Looking for kustomization files:"
          find deployment* -name "kustomization.yaml" | sort

      - name: Create missing kustomization.yaml if needed
        run: |
          if [ ! -f "deployment-alpha/overlays/development/kustomization.yaml" ]; then
            echo "Creating missing kustomization.yaml in deployment-alpha/overlays/development"
            mkdir -p deployment-alpha/overlays/development
            cat > deployment-alpha/overlays/development/kustomization.yaml << EOF
          bases:
            - ../../base
          patchesStrategicMerge:
            - mapping.yaml
          EOF
          fi

      - name: Build regular deployment
        run: |
          echo "Building regular deployment configuration:"
          ./kustomize build deployment/overlays/development > regular_deployment.yaml || ./kustomize build deployment/base > regular_deployment.yaml
          echo "Regular deployment configuration built successfully."

      - name: Build alpha deployment
        run: |
          echo "Building alpha deployment configuration:"
          ./kustomize build deployment-alpha/base > alpha_deployment.yaml
          echo "Alpha deployment configuration built successfully."

          # If we have a valid overlay, try building that too
          if [ -f "deployment-alpha/overlays/development/kustomization.yaml" ]; then
            echo "Attempting to build alpha deployment with overlay:"
            ./kustomize build deployment-alpha/overlays/development > alpha_deployment_with_overlay.yaml && \
            mv alpha_deployment_with_overlay.yaml alpha_deployment.yaml && \
            echo "Successfully built alpha deployment with overlay."
          fi

      - name: Show configurations
        run: |
          echo "=== Regular Deployment ==="
          cat regular_deployment.yaml

          echo "=== Alpha Deployment ==="
          cat alpha_deployment.yaml

      - name: Extract mappings from configurations
        run: |
          echo "=== Regular Deployment Mappings ==="
          grep -A 20 "kind: Mapping" regular_deployment.yaml || echo "No mapping found in regular deployment"

          echo "=== Alpha Deployment Mappings ==="
          grep -A 20 "kind: Mapping" alpha_deployment.yaml || echo "No mapping found in alpha deployment"

          # Save mappings to files for analysis
          grep -A 20 "kind: Mapping" regular_deployment.yaml > regular_mappings.txt || echo "" > regular_mappings.txt
          grep -A 20 "kind: Mapping" alpha_deployment.yaml > alpha_mappings.txt || echo "" > alpha_mappings.txt

      - name: Extract and verify prefixes
        run: |
          # Extract prefixes from mappings
          REGULAR_PREFIX=$(grep "prefix:" regular_mappings.txt | head -1 | awk '{print $2}' || echo "no-prefix-found")
          ALPHA_PREFIX=$(grep "prefix:" alpha_mappings.txt | head -1 | awk '{print $2}' || echo "no-prefix-found")

          echo "Regular deployment prefix: $REGULAR_PREFIX"
          echo "Alpha deployment prefix: $ALPHA_PREFIX"

          # Compare prefixes if both are found
          if [ "$REGULAR_PREFIX" != "no-prefix-found" ] && [ "$ALPHA_PREFIX" != "no-prefix-found" ]; then
            if [ "$REGULAR_PREFIX" != "$ALPHA_PREFIX" ]; then
              echo "✅ PASS: Deployments use different prefixes"
              echo "Regular deployment will use: $REGULAR_PREFIX"
              echo "Alpha deployment will use: $ALPHA_PREFIX"
              echo "They will not conflict with each other."
            else
              echo "❌ FAIL: Both deployments use the same prefix: $REGULAR_PREFIX"
              echo "This will cause conflicts - one deployment will override the other."
              exit 1
            fi
          else
            echo "⚠️ WARNING: Could not extract prefixes from one or both deployments."
            echo "Regular: $REGULAR_PREFIX, Alpha: $ALPHA_PREFIX"
            echo "Please check your mapping configurations manually."
          fi

      - name: Summary
        run: |
          echo "====== DEPLOYMENT CONFIGURATION VERIFICATION SUMMARY ======"
          echo "Regular prefix: $(grep 'prefix:' regular_mappings.txt | head -1 | awk '{print $2}' || echo 'not found')"
          echo "Alpha prefix: $(grep 'prefix:' alpha_mappings.txt | head -1 | awk '{print $2}' || echo 'not found')"

          # Final verdict
          if [ "$(grep 'prefix:' regular_mappings.txt | head -1 | awk '{print $2}' || echo 'not-found')" != "$(grep 'prefix:' alpha_mappings.txt | head -1 | awk '{print $2}' || echo 'not-found')" ]; then
            echo "✅ FINAL VERDICT: Deployments appear not to conflict"
          else
            echo "⚠️ WARNING: Could not determine definitively if deployments will conflict"
          fi
