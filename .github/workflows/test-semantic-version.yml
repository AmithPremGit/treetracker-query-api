name: Verify Alpha Deployment Configuration

on:
  workflow_dispatch:
  push:
    branches:
      - denormalized-test

jobs:
  verify-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          chmod +x ./kustomize

      - name: Build regular deployment with overlay
        run: |
          echo "Building regular deployment configuration with development overlay:"
          ./kustomize build deployment/overlays/development > regular_deployment.yaml
          echo "Regular deployment configuration built successfully."

      - name: Build alpha deployment with overlay
        run: |
          echo "Building alpha deployment configuration with development overlay:"
          ./kustomize build deployment-alpha/overlays/development > alpha_deployment.yaml
          echo "Alpha deployment configuration built successfully."

      - name: Extract mappings from configurations
        run: |
          echo "=== Regular Deployment Mappings ==="
          grep -A 20 "kind: Mapping" regular_deployment.yaml

          echo "=== Alpha Deployment Mappings ==="
          grep -A 20 "kind: Mapping" alpha_deployment.yaml

          # Save mappings to files for analysis
          grep -A 20 "kind: Mapping" regular_deployment.yaml > regular_mappings.txt
          grep -A 20 "kind: Mapping" alpha_deployment.yaml > alpha_mappings.txt

      - name: Extract and verify prefixes
        run: |
          # Extract prefixes from mappings
          REGULAR_PREFIX=$(grep "prefix:" regular_mappings.txt | head -1 | awk '{print $2}')
          ALPHA_PREFIX=$(grep "prefix:" alpha_mappings.txt | head -1 | awk '{print $2}')

          echo "Regular deployment prefix: $REGULAR_PREFIX"
          echo "Alpha deployment prefix: $ALPHA_PREFIX"

          # Compare prefixes
          if [ "$REGULAR_PREFIX" != "$ALPHA_PREFIX" ]; then
            echo "✅ PASS: Deployments use different prefixes"
            echo "Regular deployment will use: $REGULAR_PREFIX"
            echo "Alpha deployment will use: $ALPHA_PREFIX"
            echo "They will not conflict with each other."
          else
            echo "❌ FAIL: Both deployments use the same prefix: $REGULAR_PREFIX"
            echo "This will cause conflicts - one deployment will override the other."
            exit 1
          fi

      - name: Verify service names
        run: |
          # Extract service names
          REGULAR_SERVICE=$(grep "service:" regular_mappings.txt | head -1 | awk '{print $2}')
          ALPHA_SERVICE=$(grep "service:" alpha_mappings.txt | head -1 | awk '{print $2}')

          echo "Regular deployment service: $REGULAR_SERVICE"
          echo "Alpha deployment service: $ALPHA_SERVICE"

          # Check if services are appropriately named
          if [[ "$REGULAR_SERVICE" == *"main"* ]] || [[ "$ALPHA_SERVICE" == *"alpha"* ]]; then
            echo "✅ PASS: Service names follow appropriate naming convention"
          else
            echo "⚠️ WARNING: Service names might not follow the expected naming convention"
            echo "This is not a failure but consider reviewing service naming."
          fi

      - name: Check for host conflicts
        run: |
          # Extract host values if present
          REGULAR_HOST=$(grep "host:" regular_mappings.txt | head -1 | awk '{print $2}' || echo "not-specified")
          ALPHA_HOST=$(grep "host:" alpha_mappings.txt | head -1 | awk '{print $2}' || echo "not-specified")

          if [ "$REGULAR_HOST" != "not-specified" ] && [ "$ALPHA_HOST" != "not-specified" ]; then
            if [ "$REGULAR_HOST" != "$ALPHA_HOST" ]; then
              echo "✅ PASS: Deployments use different hosts"
            else
              echo "⚠️ WARNING: Both deployments use the same host: $REGULAR_HOST"
              echo "This might cause conflicts if prefixes overlap."
            fi
          else
            echo "ℹ️ INFO: Host not specified for one or both deployments."
          fi

      - name: Verify CORS configurations
        run: |
          # Check if CORS is configured
          if grep -q "cors:" regular_mappings.txt; then
            echo "✅ Regular deployment has CORS configuration"
          else
            echo "⚠️ WARNING: Regular deployment is missing CORS configuration"
          fi

          if grep -q "cors:" alpha_mappings.txt; then
            echo "✅ Alpha deployment has CORS configuration"
          else
            echo "⚠️ WARNING: Alpha deployment may be missing CORS configuration"
          fi

      - name: Summary
        run: |
          echo "====== DEPLOYMENT CONFIGURATION VERIFICATION SUMMARY ======"
          echo "1. Regular deployment (overlays/development): $(grep 'prefix:' regular_mappings.txt | head -1 | awk '{print $2}')"
          echo "2. Alpha deployment (overlays/development): $(grep 'prefix:' alpha_mappings.txt | head -1 | awk '{print $2}')"
          echo "3. Services: Regular: $(grep 'service:' regular_mappings.txt | head -1 | awk '{print $2}'), Alpha: $(grep 'service:' alpha_mappings.txt | head -1 | awk '{print $2}')"

          # Final verdict
          if [ "$(grep 'prefix:' regular_mappings.txt | head -1 | awk '{print $2}')" != "$(grep 'prefix:' alpha_mappings.txt | head -1 | awk '{print $2}')" ]; then
            echo "✅ FINAL VERDICT: Deployments WILL NOT conflict"
          else
            echo "❌ FINAL VERDICT: Deployments WILL conflict"
            exit 1
          fi
