name: Simulate Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - denormalized-test

jobs:
  simulate-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          chmod +x ./kustomize

      - name: Build regular deployment
        run: |
          echo "Building regular deployment configuration:"
          ./kustomize build deployment/base > regular_deployment.yaml
          echo "Regular deployment configuration built successfully."

      - name: Build alpha deployment
        run: |
          echo "Building alpha deployment configuration:"
          ./kustomize build deployment-alpha/base > alpha_deployment.yaml
          echo "Alpha deployment configuration built successfully."

      - name: Extract mappings from configurations
        run: |
          echo "Extracting mappings from regular deployment:"
          grep -A 15 "kind: Mapping" regular_deployment.yaml > regular_mapping.txt

          echo "Extracting mappings from alpha deployment:"
          grep -A 15 "kind: Mapping" alpha_deployment.yaml > alpha_mapping.txt

          echo "Regular mapping:"
          cat regular_mapping.txt

          echo "Alpha mapping:"
          cat alpha_mapping.txt

      - name: Compare prefixes
        run: |
          # Extract prefixes
          REGULAR_PREFIX=$(grep "prefix:" regular_mapping.txt | awk '{print $2}')
          ALPHA_PREFIX=$(grep "prefix:" alpha_mapping.txt | awk '{print $2}')

          echo "Regular deployment prefix: $REGULAR_PREFIX"
          echo "Alpha deployment prefix: $ALPHA_PREFIX"

          # Compare prefixes
          if [ "$REGULAR_PREFIX" != "$ALPHA_PREFIX" ]; then
            echo "✅ PASS: Deployments use different prefixes"
            echo "Regular deployment will use: $REGULAR_PREFIX"
            echo "Alpha deployment will use: $ALPHA_PREFIX"
            echo "They will not conflict with each other."
          else
            echo "❌ FAIL: Both deployments use the same prefix: $REGULAR_PREFIX"
            echo "This will cause conflicts - one deployment will override the other."
            exit 1
          fi

      - name: Verify service names
        run: |
          # Extract service names
          REGULAR_SERVICE=$(grep "service:" regular_mapping.txt | awk '{print $2}')
          ALPHA_SERVICE=$(grep "service:" alpha_mapping.txt | awk '{print $2}')

          echo "Regular deployment service: $REGULAR_SERVICE"
          echo "Alpha deployment service: $ALPHA_SERVICE"

          # No need to compare - just informative

      - name: Summary
        run: |
          echo "====== DEPLOYMENT SIMULATION SUMMARY ======"
          echo "1. Regular deployment built successfully from deployment/base"
          echo "2. Alpha deployment built successfully from deployment-alpha/base"
          echo "3. Regular deployment prefix: $(grep 'prefix:' regular_mapping.txt | awk '{print $2}')"
          echo "4. Alpha deployment prefix: $(grep 'prefix:' alpha_mapping.txt | awk '{print $2}')"
          echo "5. Services: Regular: $(grep 'service:' regular_mapping.txt | awk '{print $2}'), Alpha: $(grep 'service:' alpha_mapping.txt | awk '{print $2}')"
          echo "CONCLUSION: The deployments $(if [ "$(grep 'prefix:' regular_mapping.txt | awk '{print $2}')" != "$(grep 'prefix:' alpha_mapping.txt | awk '{print $2}')" ]; then echo "WILL NOT conflict"; else echo "WILL conflict"; fi)"
