name: Test Semantic Version for denormalized-test

on:
  push:
    branches:
      - denormalized-test

jobs:
  test-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0 # Important for semantic-release to analyze commit history

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/git @semantic-release/changelog

      - name: Run semantic-release dry run
        run: npx semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check current package version
        run: |
          echo "Current package.json version: $(node -p "require('./package.json').version")"
