name: Test Deployment Directory

on:
  workflow_dispatch:
  push:
    branches:
      - denormalized-test

jobs:
  check-deployment-directory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: List directories
        run: |
          echo "Listing all deployment directories:"
          ls -la | grep deployment

      - name: Check .releaserc
        run: |
          echo "Checking .releaserc configuration:"
          if [ -f ".releaserc" ]; then
            echo "Content of .releaserc:"
            cat .releaserc
            
            if grep -q "denormalized-test" .releaserc && grep -q "alpha" .releaserc; then
              echo "✅ .releaserc contains denormalized-test branch with alpha channel"
            else
              echo "❌ .releaserc missing configuration for denormalized-test branch"
            fi
          elif [ -f ".releaserc.json" ]; then
            echo "Content of .releaserc.json:"
            cat .releaserc.json
            
            if grep -q "denormalized-test" .releaserc.json && grep -q "alpha" .releaserc.json; then
              echo "✅ .releaserc.json contains denormalized-test branch with alpha channel"
            else
              echo "❌ .releaserc.json missing configuration for denormalized-test branch"
            fi
          else
            echo "❌ No .releaserc or .releaserc.json file found"
          fi

      - name: Check deployment workflows
        run: |
          echo "Checking GitHub workflow files:"
          ls -la .github/workflows/

          if grep -r "deployment-alpha" .github/workflows/; then
            echo "✅ Found workflow file that uses deployment-alpha directory"
          else
            echo "❌ No workflow file found that uses deployment-alpha directory"
          fi
